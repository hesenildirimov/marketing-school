# origin.marketingschool.az — yalnız Netlify proxy-dən gələn sorğular (imza app-də yoxlanılır)
server {
    listen 80;
    server_name origin.marketingschool.az;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name origin.marketingschool.az;
    ssl_certificate     /etc/letsencrypt/live/origin.marketingschool.az/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/origin.marketingschool.az/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 8m;
    root /var/www/public;

    # x-nf-sign başlığı olmayan sorğular app-ə çatmadan rədd edilir (health istisna)
    set $nf_ok 0;
    if ($http_x_nf_sign != "") { set $nf_ok 1; }

    location = /platform/up { try_files $uri /index.php?$query_string; }

    location ^~ /platform/assets/ {
        if ($nf_ok = 0) { return 403; }
        add_header Cache-Control "public, max-age=604800, immutable";
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }

    location /platform {
        if ($nf_ok = 0) { return 403; }
        try_files /nonexistent /index.php?$query_string;
    }

    # Private fayllar: yalnız app-in X-Accel-Redirect cavabı ilə (birbaşa URL ilə açılmır)
    location ^~ /_protected/ {
        internal;
        alias /var/www/storage/app/private/;
        add_header X-Content-Type-Options nosniff;
        add_header Content-Security-Policy "default-src 'none'; sandbox";
    }

    location = /index.php {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        include fastcgi_params;
        fastcgi_read_timeout 30s;
        fastcgi_hide_header X-Powered-By;
    }

    location / { return 404; }
}

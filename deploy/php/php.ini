expose_php = Off
display_errors = Off
log_errors = On
memory_limit = 256M
upload_max_filesize = 6M        ; fayllar 5 MB-lıq hissələrlə yüklənir (Netlify proxy 26 san limiti)
post_max_size = 8M
max_execution_time = 25         ; Netlify proxy timeout-undan (26 san) qısa
max_input_time = 25
session.use_strict_mode = 1
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
allow_url_fopen = Off           ; SSRF riskini azaldır (xarici sorğular yalnız HTTP klientlə, allowlist ilə)
disable_functions = exec,passthru,shell_exec,system   ; proc_open scheduler üçün lazımdır

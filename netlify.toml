[build]
  command = "npm run build"
  publish = "_site"

[[redirects]]
  from = "https://www.marketingschool.az/*"
  to = "https://marketingschool.az/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://marketingschool.az/*"
  to = "https://marketingschool.az/:splat"
  status = 301
  force = true

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"
